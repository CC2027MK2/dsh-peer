- insert:
    - id: dsh-peer
      name: dsh-peer
      config:
        # The MCP endpoint lives at http://<host>:<port>/mcp
        port: 38404
        # Set a bearer token before exposing this host to an untrusted network;
        # an empty token keeps the endpoint open (LAN / loopback only).
        token: ''
        # Peer conversation slots become sessions named "<prefix>:<slot>", so a
        # peer can never address one of your own sessions by accident.
        sessionPrefix: peer
        # Upper bound on one blocking peer_ask call, in milliseconds. Work that
        # may take longer should use mode:"async" and peer_task instead.
        askTimeoutMs: 240000
        # Live conversation slots kept warm; the least recently used is dropped
        # once this many are open (each one holds a whole agent + event log).
        maxSlots: 8
        # Who this host is in the peer vocabulary. Setting it turns CHATv1 on:
        # inbound envelopes are validated and deduplicated, outbound replies are
        # stamped with from/msg/ts/reply so both sides can tell peers from humans.
        identity: ''
        chatProtocol: true
        # A reply longer than this is split into `chunk=i/n` envelopes.
        maxChunkChars: 60000
        # Ceiling for one background (mode:"async") task.
        taskTimeoutMs: 1800000
        # Optional: read the token from a file instead of inlining it (wins over
        # token); keeps a shared profile free of plain-text secrets.
        # tokenFile: ''
        # Pin the sandbox mode for peer sessions. Hosts where no sandbox backend
        # is usable (PRoot/containers) refuse workspace-write outright, so a peer
        # that must run commands there needs danger-full-access.
        # sandboxMode: danger-full-access
        # Tool names to strip from peer sessions; use it to stop two peers from
        # calling each other in a loop.
        # denyTools: [mcp__phone__peer_ask]
        # Optional preset for peer sessions (a preset without any MCP client is
        # the other half of the loop guard).
        # agentPreset: dsh-executor
        #
        # Artifact handoff. A peer that sends `artifacts[]` gets every entry
        # checked before the agent runs: HEAD for existence and size, sha256 for
        # the bytes. `artifactHosts` is the allowlist of hosts we will fetch
        # from; leave it empty to allow any host, or list hosts to pin them.
        # artifactHosts: [192.0.2.10]
        # artifactMaxBytes: 67108864
        # artifactTimeoutMs: 20000
        # When strictArtifacts is true, every URL named in a message body must
        # also appear in artifacts[]; a bare "the file is at <url>" is refused.
        # strictArtifacts: true
        #
        # What this host promises it can do, reported by peer_status. Everything
        # here is optional: `tools: null` means "undeclared", not "no tools".
        # capabilities:
        #   tools: [bash, read, write, edit]
        #   shell: bash
        #   writableRoots: [/root/workspace]
        #
        # Group rooms. A room is a hub-hosted, append-only log: members read it
        # with room_sync (poll-since), so a member behind NAT never needs a port.
        # Declare rooms here; an undeclared room is refused by name.
        # rooms:
        #   lobby:
        #     members: [pc, phone, laptop]
        #   build:
        #     members: [pc, phone]
        # roomMaxEvents: 2000
